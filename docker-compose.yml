version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: bunch-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bunch
    volumes:
      - mongodb_data:/data/db
    networks:
      - bunch-network

  redis:
    image: redis:7-alpine
    container_name: bunch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bunch-network

volumes:
  mongodb_data:
  redis_data:

networks:
  bunch-network:
    driver: bridge





