version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: polybanter-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: polybanter
    volumes:
      - mongodb_data:/data/db
    networks:
      - polybanter-network

  redis:
    image: redis:7-alpine
    container_name: polybanter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - polybanter-network

volumes:
  mongodb_data:
  redis_data:

networks:
  polybanter-network:
    driver: bridge




