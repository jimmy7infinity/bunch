<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Authentication Successful</title>
  <style>
    body {
      background: #19191A;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    .spinner {
      border: 3px solid #333;
      border-top: 3px solid #5BC854;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>✅ Authentication Successful</h2>
    <p>Logging you into PolyBanter...</p>
    <p style="font-size: 12px; color: #707070; margin-top: 20px;">This window will close automatically.</p>
  </div>

  <script>
    // Extract token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    console.log('🔑 Auth success page loaded, token present:', !!token);

    if (token && typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.id) {
      console.log('📦 Extension context detected, storing token');
      
      // Store in chrome.storage
      chrome.storage.local.set({ authToken: token }, () => {
        console.log('✅ Token stored in chrome.storage');
        
        // Close this tab after a brief delay
        setTimeout(() => {
          console.log('👋 Closing auth tab');
          window.close();
        }, 1000);
      });
    } else if (token) {
      // Fallback for web app - redirect to main app
      console.log('🌐 Web context, redirecting to main app');
      window.location.href = '/?token=' + token;
    } else {
      console.error('❌ No token found in URL');
    }
  </script>
</body>
</html>
