name: Sync to Personal Repo

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to personal repo
        env:
          PERSONAL_REPO: ${{ secrets.PERSONAL_REPO_URL }}
        run: |
          git remote add personal $PERSONAL_REPO
          git push personal main --force
