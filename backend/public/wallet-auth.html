<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunch - Connect Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #19191A;
            color: #D3D3D3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #C0C0C0, #CBCBCB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 14px;
            color: #909090;
            margin-bottom: 40px;
        }
        
        .status {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 13px;
        }
        
        .status.info {
            background: rgba(91, 200, 84, 0.1);
            border: 1px solid rgba(91, 200, 84, 0.3);
            color: #5BC854;
        }
        
        .status.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #FF4444;
        }
        
        button {
            width: 100%;
            height: 50px;
            border-radius: 25px;
            border: 1px solid transparent;
            background-image: linear-gradient(#19191A, #19191A), linear-gradient(135deg, #707070, #333333);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: #B9B7B7;
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:hover:not(:disabled) {
            opacity: 0.8;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(185, 183, 183, 0.3);
            border-radius: 50%;
            border-top-color: #B9B7B7;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .wallet-address {
            font-size: 12px;
            color: #606060;
            margin-top: 16px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/logo2.png" alt="Bunch Logo" />
        </div>
        
        <h1>Connect Your Wallet</h1>
        <p class="subtitle">Sign a message to authenticate with Bunch</p>
        
        <div id="status" class="status info" style="display: none;">
            Connecting...
        </div>
        
        <button id="connectBtn">
            Connect Wallet
        </button>
        
        <div id="walletAddress" class="wallet-address" style="display: none;"></div>
    </div>
    
    <script src="/wallet-auth.js"></script>
</body>
</html>
