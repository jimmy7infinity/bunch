<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunch - Connect Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #19191A;
            color: #D3D3D3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #C0C0C0, #CBCBCB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 14px;
            color: #909090;
            margin-bottom: 40px;
        }
        
        .status {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 13px;
        }
        
        .status.info {
            background: rgba(91, 200, 84, 0.1);
            border: 1px solid rgba(91, 200, 84, 0.3);
            color: #5BC854;
        }
        
        .status.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.3);
            color: #FF4444;
        }
        
        button {
            width: 100%;
            height: 50px;
            border-radius: 25px;
            border: 1px solid transparent;
            background-image: linear-gradient(#19191A, #19191A), linear-gradient(135deg, #707070, #333333);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            color: #B9B7B7;
            font-size: 13px;
            font-weight: 300;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        button:hover:not(:disabled) {
            opacity: 0.8;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(185, 183, 183, 0.3);
            border-radius: 50%;
            border-top-color: #B9B7B7;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .wallet-address {
            font-size: 12px;
            color: #606060;
            margin-top: 16px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo" style="font-size: 60px; line-height: 120px;">
            🔐
        </div>
        
        <h1>Connect Your Wallet</h1>
        <p class="subtitle">Sign a message to authenticate with Bunch</p>
        
        <div id="status" class="status info" style="display: none;">
            Connecting...
        </div>
        
        <button id="connectBtn" onclick="connectWallet()">
            Connect Wallet
        </button>
        
        <div id="walletAddress" class="wallet-address" style="display: none;"></div>
    </div>
    
    <script>
        const API_URL = window.location.origin + '/api';
        let userAddress = null;
        
        function setStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }
        
        function setButtonState(disabled, text) {
            const btn = document.getElementById('connectBtn');
            btn.disabled = disabled;
            btn.innerHTML = disabled ? `<span class="spinner"></span>${text}` : text;
        }
        
        async function connectWallet() {
            console.log('🔵 Connect wallet clicked');
            console.log('🔍 window.ethereum:', typeof window.ethereum);
            console.log('🌐 API_URL:', API_URL);
            
            try {
                // Check if MetaMask is installed
                if (typeof window.ethereum === 'undefined') {
                    console.error('❌ No Web3 wallet detected');
                    setStatus('Please install MetaMask or another Web3 wallet', 'error');
                    return;
                }
                
                console.log('✅ Web3 wallet detected');
                setButtonState(true, 'Connecting...');
                setStatus('Requesting wallet connection...', 'info');
                
                // Request account access
                console.log('📡 Requesting accounts...');
                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });
                
                userAddress = accounts[0];
                console.log('✅ Connected:', userAddress);
                document.getElementById('walletAddress').textContent = `Connected: ${userAddress.slice(0, 6)}...${userAddress.slice(-4)}`;
                document.getElementById('walletAddress').style.display = 'block';
                
                setStatus('Generating signature message...', 'info');
                
                // Request nonce from backend
                console.log('📡 Requesting nonce from:', `${API_URL}/auth/siwe/nonce`);
                const nonceResponse = await fetch(`${API_URL}/auth/siwe/nonce`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: userAddress })
                });
                
                console.log('📥 Nonce response status:', nonceResponse.status);
                
                if (!nonceResponse.ok) {
                    const errorText = await nonceResponse.text();
                    console.error('❌ Nonce error:', errorText);
                    throw new Error('Failed to get nonce: ' + errorText);
                }
                
                const { nonce } = await nonceResponse.json();
                console.log('✅ Got nonce:', nonce);
                
                // Create SIWE message
                const message = `Welcome to Bunch!\n\nClick "Sign" to securely authenticate your wallet.\n\nThis request will not trigger a blockchain transaction or cost any gas fees.\n\nWallet: ${userAddress}\nNonce: ${nonce}`;
                
                setStatus('Please sign the message in your wallet...', 'info');
                
                // Request signature
                console.log('✍️ Requesting signature...');
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [message, userAddress]
                });
                
                console.log('✅ Got signature:', signature.slice(0, 20) + '...');
                setStatus('Verifying signature...', 'info');
                
                // Verify signature with backend
                console.log('📡 Verifying signature at:', `${API_URL}/auth/siwe/verify`);
                const verifyResponse = await fetch(`${API_URL}/auth/siwe/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        address: userAddress,
                        signature: signature,
                        message: message,
                        nonce: nonce
                    })
                });
                
                console.log('📥 Verify response status:', verifyResponse.status);
                console.log('📥 Response redirected:', verifyResponse.redirected);
                console.log('📥 Response URL:', verifyResponse.url);
                
                if (!verifyResponse.ok) {
                    const errorText = await verifyResponse.text();
                    console.error('❌ Verify error:', errorText);
                    throw new Error('Signature verification failed: ' + errorText);
                }
                
                setStatus('✅ Authentication successful! Redirecting...', 'info');
                setButtonState(true, 'Success!');
                
                // Backend redirects to extension
                if (verifyResponse.redirected) {
                    console.log('🔀 Following redirect to:', verifyResponse.url);
                    window.location.href = verifyResponse.url;
                } else {
                    console.log('⚠️ No redirect detected, checking response...');
                    const result = await verifyResponse.json();
                    console.log('📥 Response data:', result);
                }
                
            } catch (error) {
                console.error('❌ Wallet auth error:', error);
                console.error('Error details:', {
                    message: error.message,
                    code: error.code,
                    stack: error.stack
                });
                
                if (error.code === 4001) {
                    setStatus('Authentication cancelled', 'error');
                } else {
                    setStatus(`Error: ${error.message || 'Authentication failed'}`, 'error');
                }
                
                setButtonState(false, 'Try Again');
            }
        }
        
        // Log page load
        console.log('🔵 Wallet auth page loaded');
        console.log('🌐 Origin:', window.location.origin);
        console.log('🌐 API_URL:', API_URL);
        
        // Auto-connect if wallet is already connected
        window.addEventListener('load', async () => {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ 
                        method: 'eth_accounts' 
                    });
                    
                    if (accounts.length > 0) {
                        setStatus('Wallet detected. Click to connect.', 'info');
                    }
                } catch (error) {
                    console.error('Failed to check wallet connection:', error);
                }
            }
        });
    </script>
</body>
</html>
