<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Authentication Successful</title>
  <style>
    body {
      background: #19191A;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    .spinner {
      border: 3px solid #333;
      border-top: 3px solid #5BC854;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>✅ Authentication Successful</h2>
    <p>Logging you into Bunch...</p>
    <p style="font-size: 12px; color: #707070; margin-top: 20px;">This window will close automatically.</p>
  </div>

  <script>
    // Extract token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    console.log('🔑 Auth success page loaded, token present:', !!token);
    console.log('🔍 Chrome runtime available:', typeof chrome !== 'undefined' && !!chrome.runtime);

    if (!token) {
      console.error('❌ No token found in URL');
      document.querySelector('.container').innerHTML = '<h2>❌ Authentication Failed</h2><p>No token received</p>';
    } else {
      console.log('✅ Token received, storing locally and closing tab');
      
      // Store token in localStorage (accessible by extension via content script)
      try {
        localStorage.setItem('bunch_auth_token', token);
        console.log('💾 Token stored in localStorage');
      } catch (e) {
        console.error('❌ Failed to store in localStorage:', e);
      }
      
      // Close the tab after a brief delay
      setTimeout(() => {
        console.log('👋 Closing auth tab in 1 second...');
        window.close();
      }, 1000);
    }
  </script>
</body>
</html>
