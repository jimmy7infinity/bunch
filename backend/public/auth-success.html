<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Authentication Successful</title>
  <style>
    body {
      background: #19191A;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
    }
    .spinner {
      border: 3px solid #333;
      border-top: 3px solid #5BC854;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h2>✅ Authentication Successful</h2>
    <p>Logging you into PolyBanter...</p>
    <p style="font-size: 12px; color: #707070; margin-top: 20px;">This window will close automatically.</p>
  </div>

  <script>
    // Extract token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    console.log('🔑 Auth success page loaded, token present:', !!token);
    console.log('🔍 Chrome runtime available:', typeof chrome !== 'undefined' && !!chrome.runtime);

    if (!token) {
      console.error('❌ No token found in URL');
      document.querySelector('.container').innerHTML = '<h2>❌ Authentication Failed</h2><p>No token received</p>';
    } else {
      // Check if we have chrome.runtime (means we're opened by the extension)
      if (typeof chrome !== 'undefined' && chrome.runtime) {
        console.log('📦 Chrome runtime detected, trying to communicate with extension');
        
        // When opened from a webpage, we need the extension ID
        // We'll use the manifest to make this page externally_connectable
        // For now, use storage API directly since we're opened by extension tabs.create()
        
        if (chrome.storage) {
          console.log('💾 Using chrome.storage to save token');
          try {
            chrome.storage.local.set({ authToken: token }, () => {
              if (chrome.runtime.lastError) {
                console.error('❌ Storage error:', chrome.runtime.lastError);
              } else {
                console.log('✅ Token stored in chrome.storage successfully');
                
                // Close this tab after a brief delay
                setTimeout(() => {
                  console.log('👋 Closing auth tab');
                  window.close();
                }, 1000);
              }
            });
          } catch (error) {
            console.error('❌ Failed to access chrome.storage:', error);
          }
        } else {
          console.error('❌ chrome.storage not available');
        }
      } else {
        console.log('🌐 Regular web context (not extension)');
        // For regular web app, redirect to main page with token
        setTimeout(() => {
          window.location.href = '/?token=' + token;
        }, 1000);
      }
    }
  </script>
</body>
</html>
